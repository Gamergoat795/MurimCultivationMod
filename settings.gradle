pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }

    // Plugin versions live in gradle.properties so there is exactly one place to bump them.
    plugins {
        id 'net.neoforged.moddev' version "${moddev_version}"
    }
}

plugins {
    // Auto-provisions a JDK 21 toolchain if the machine doesn't already have one.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'murimcultivation'
