# Placeholders in this file are expanded by processResources from gradle.properties,
# so mod metadata can never drift from the build configuration.
#
# Note: expansion runs this file through Groovy's template engine, so a bare dollar-brace
# sequence that is not a real property reference is a build failure, even inside a comment.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Gamergoat795/MurimCultivationMod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
