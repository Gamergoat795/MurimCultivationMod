name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Static checks that need no NeoForge artifact. Run before the build so a misspelled
      # resource path or a datapack contradiction fails in seconds rather than after a
      # two-minute compile.
      - name: Verify sources
        run: python3 tools/verify_sources.py

      # Output is teed so the two summariser steps below can read it. --stacktrace is gone
      # deliberately: its ~150 lines of Gradle internals never once pointed at a real cause,
      # and they push the compiler's own diagnostics out of reach of a log tail.
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build-output.txt

      # A compile error is the failure mode with the worst signal-to-noise: javac's one useful
      # line sits hundreds of lines up the log. This reprints just the diagnostics, with the
      # offending source line and the caret, so the log ends with what actually broke.
      - name: Summarise compile errors
        if: failure()
        run: |
          if [ ! -f build-output.txt ]; then
            echo "No build output captured."
            exit 0
          fi
          python3 - <<'PY'
          import re, sys

          # javac: "/path/Foo.java:42: error: cannot find symbol". Gradle may prefix the line.
          pattern = re.compile(r'(\S+\.java):(\d+):\s*(error|warning):\s*(.*)')
          lines = open('build-output.txt', errors='replace').read().splitlines()

          found = []
          for i, line in enumerate(lines):
              match = pattern.search(line)
              if match and match.group(3) == 'error':
                  # javac follows each diagnostic with the source line and a caret.
                  detail = [l for l in lines[i + 1:i + 3] if l.strip() and not pattern.search(l)]
                  found.append((match.group(1), match.group(2), match.group(4), detail))

          # Gradle prints each diagnostic twice: once as the compiler emits it, and again inside
          # the "What went wrong" block. Reporting "4 compile error(s)" for two real ones misleads
          # about how much is broken, so collapse by file, line and message.
          unique = {}
          for path, line_no, message, detail in found:
              unique.setdefault((path, line_no, message), detail)
          found = [(path, line_no, message, detail)
                   for (path, line_no, message), detail in unique.items()]

          if not found:
              print("No javac diagnostics in the build output; the failure is elsewhere.")
              print("Last 30 lines:\n")
              for line in lines[-30:]:
                  print(f"  {line}")
              sys.exit(0)

          print(f"{len(found)} compile error(s):\n")
          for path, line_no, message, detail in found:
              # Trim the runner's absolute prefix so paths match what you have checked out.
              short = path.split('/src/', 1)
              short = 'src/' + short[1] if len(short) == 2 else path
              print(f"  {short}:{line_no}")
              print(f"      {message}")
              for extra in detail:
                  print(f"      {extra.rstrip()}")
              print()
          PY

      # Gradle's failure output buries the actual assertion. This pulls the failing test names
      # and messages out of the JUnit XML so the log says what broke without anyone downloading
      # the HTML report.
      - name: Summarise test failures
        if: failure()
        run: |
          shopt -s nullglob
          results=(build/test-results/test/*.xml)
          if [ ${#results[@]} -eq 0 ]; then
            echo "No JUnit XML found — the build failed before tests ran (likely a compile error)."
            exit 0
          fi
          python3 - "${results[@]}" <<'PY'
          import sys, xml.etree.ElementTree as ET

          failures = []
          for path in sys.argv[1:]:
              for case in ET.parse(path).getroot().iter('testcase'):
                  for problem in list(case.findall('failure')) + list(case.findall('error')):
                      failures.append((
                          case.get('classname', '?').rsplit('.', 1)[-1],
                          case.get('name', '?'),
                          (problem.get('message') or '').strip(),
                          (problem.text or '').strip().splitlines(),
                      ))

          if not failures:
              print("Tests all passed; the build failed for another reason.")
              sys.exit(0)

          print(f"{len(failures)} failing test(s):\n")
          for cls, name, message, trace in failures:
              print(f"  {cls} > {name}")
              for line in message.splitlines():
                  print(f"      {line}")
              # The first frame inside our own package is the assertion that actually fired.
              for line in trace:
                  if 'com.andymods.murimcultivation' in line:
                      frame = line.strip()
                      # JUnit's trace lines already start with "at".
                      print(f"      {frame if frame.startswith('at ') else 'at ' + frame}")
                      break
              print()
          PY

      # The one gate a unit test cannot provide: does the mod load on a DEDICATED server, where no
      # client class exists? A method reference to ClientPayloadHandler in common code compiles,
      # passes every test, and then kills the server with NoClassDefFoundError at startup. Nothing
      # else in CI can see that, so this boots a real headless server and waits for "Done (".
      #
      # Polled rather than run under a fixed timeout, because a server never exits on its own and
      # a timeout would spend its whole budget on every green build. Fails on the specific
      # symptoms first so a red run says why without anyone opening a 2000-line log.
      - name: Dedicated server smoke test
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          setsid ./gradlew runServer --console=plain --no-daemon > server-output.txt 2>&1 &
          server_pid=$!

          status=timeout
          for _ in $(seq 1 150); do
            if grep -q "Done (" server-output.txt; then status=up; break; fi
            if grep -qE "NoClassDefFoundError|ClassNotFoundException|Mod Loading has failed|Failed to start the minecraft server" server-output.txt; then status=crashed; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then status=exited; break; fi
            sleep 2
          done

          # setsid made the wrapper a process-group leader, so this takes the forked JVM down too.
          kill -TERM -- "-$server_pid" 2>/dev/null || true
          sleep 3
          kill -KILL -- "-$server_pid" 2>/dev/null || true

          if [ "$status" = up ]; then
            grep -m1 "Done (" server-output.txt
            echo "Dedicated server started cleanly."
            exit 0
          fi

          echo "::error::Dedicated server did not start ($status)."
          echo "--- client-class leaks and loading errors ---"
          grep -nE "NoClassDefFoundError|ClassNotFoundException|Mod Loading has failed|Caused by" server-output.txt | head -30 || true
          echo "--- last 80 lines ---"
          tail -80 server-output.txt
          exit 1

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: murimcultivation-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
