# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true


## Platform

# Minecraft version. Must agree with the NeoForge version below.
minecraft_version=1.21.1
# Accepted Minecraft range for this mod.
minecraft_version_range=[1.21.1,1.22)

# NeoForge version for Minecraft 1.21.1 (the 21.1.x line).
# 21.1.72 is a known-good floor; bumping to the latest 21.1.x is safe and recommended.
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.72
# Only the major version is used as a bound, per NeoForge convention.
neo_version_range=[21.1,)
# The FML/loader range. Major version only.
loader_version_range=[4,)

# ModDevGradle — the official NeoForge Gradle plugin.
moddev_version=2.0.147


